name: Profile cards
on:
  schedule:
    - cron: "17 6 * * *"   # diario, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/generate.mjs", ".github/workflows/profile-cards.yml"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/generate.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile
          git diff --cached --quiet || git commit -m "chore: actualizar tarjetas del perfil"
          git push
